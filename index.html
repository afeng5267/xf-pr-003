<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飞行器大战 - Aircraft Battle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="480" height="720"></canvas>
        <div id="hud">
            <div id="score">得分: 0</div>
            <div id="lives">生命: ❤️❤️❤️</div>
            <div id="level">关卡: 1</div>
        </div>
        <div id="start-screen">
            <h1>✈️ 飞行器大战</h1>
            <p>用 ← → ↑ ↓ 或 WASD 移动</p>
            <p>空格键发射子弹</p>
            <p>击落敌机得分，躲避碰撞！</p>
            <button id="start-btn">开始游戏</button>
        </div>
        <div id="game-over-screen" style="display:none;">
            <h1>💥 游戏结束</h1>
            <p id="final-score">最终得分: 0</p>
            <button id="restart-btn">再来一局</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
